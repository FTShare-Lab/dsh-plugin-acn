- insert:
    - id: acn
      name: cordis:group
      group: true
      isolate:
        acnKnowledge: true
        acnRuntime: true
        acnFormation: true
        acnInbox: true
        acnDream: true
        acnMemory: true
      config:
        - id: acn-configuration
          name: '@ftai/dsh-plugin-acn'
        - id: acn-knowledge
          name: '@ftai/dsh-plugin-acn/knowledge'
          config:
            agentId: ''
        - id: acn-prompt
          name: '@ftai/dsh-plugin-acn/prompt'
        - id: acn-tools
          name: '@ftai/dsh-plugin-acn/tools'
        - id: acn-formation
          name: '@ftai/dsh-plugin-acn/formation'
        - id: acn-inbox
          name: '@ftai/dsh-plugin-acn/inbox'
        - id: acn-dream
          name: '@ftai/dsh-plugin-acn/dream'
        - id: acn-memory
          name: '@ftai/dsh-plugin-acn/memory'
        - id: acn-commands
          name: '@ftai/dsh-plugin-acn/commands'
