name: Installation diagnostics

on:
  push:
    branches: [fix/windows-install-smoke]

permissions:
  contents: read

jobs:
  windows-install:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm install --global @deepseek-ai/dsh@0.2.1-rc.2
      - name: Repeat isolated installed-package scenarios
        shell: pwsh
        run: |
          1..20 | ForEach-Object {
            Write-Host "Installation sample $_"
            pnpm smoke:install
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
